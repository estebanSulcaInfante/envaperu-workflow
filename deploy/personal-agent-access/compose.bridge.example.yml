# Merge into the reviewed existing stack. No Gateway port may bypass the bridge.
services:
  scm-personal-access:
    container_name: enva-scm-personal-access
    image: ${SCM_PERSONAL_BRIDGE_IMAGE:?Set the reviewed immutable image digest}
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [./private-bridge.env]
    volumes:
      - scm-personal-access-sessions:/var/lib/scm-openclaw-bridge
      - ./private-config/maintenance-password:/run/secrets/maintenance-password:ro
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5182/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  scm-personal-access-sessions:
