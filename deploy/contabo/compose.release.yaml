# RELEASE SOURCE: 8e21ee31ed8cf0c20c5b25800c4ea171cc312d4f
# PREPARATION ONLY: requires approved administrator handoff before any start.
# Project name is controlled by Dokploy: envaperuscmpilot-scmpilot-cnxr9n
services:
  api:
    image: ghcr.io/estebansulcainfante/envaperu-scm-api@sha256:959ad9f4ed5c1f9d64e80ea1689324eb790497e2166ca468200336317e09414a
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 128
    env_file:
      - ${SCM_API_ENV_FILE:?Administrator must securely supply API environment file}
    environment:
      - SCM_AUTH_MODE=supabase
      - SCM_ASSISTANT_ENABLED=true
      - SCM_ASSISTANT_PROVIDER=openclaw
      - SCM_ASSISTANT_ACTOR_ID=1
      - SCM_ASSISTANT_AUTH_USER_ID=28044442-3caf-4a92-97e4-212b50aa3c3b
      - SCM_OPENCLAW_URL=https://openclaw-scm:18789
      - SCM_OPENCLAW_PRIVATE_HOST=openclaw-scm
      - SCM_OPENCLAW_TOKEN_FILE=/run/secrets/openclaw-token
      - SCM_OPENCLAW_CA_FILE=/run/openclaw/gateway-ca.crt
      - SCM_OPENCLAW_POLICY_CONFIRMED=false
      - POSTPESAJE_REPRINT_ENABLED=true
      - KG_RECEIPT_WRITE_ENABLED=true
      - KG_CUSTODY_WRITE_ENABLED=true
      - KG_AUTOMATIC_INTAKE_ENABLED=true
      # List syntax keeps the ISO instant inside a KEY=value scalar so
      # Dokploy cannot coerce it into a Go time rendering.
      - KG_AUTOMATIC_INTAKE_CUTOFF_AT=2026-10-08T18:16:04Z
      - KG_PRODUCTION_LOCATION_CODE=PRODUCCION_KG
      - CATALOG_IMAGE_STORAGE=supabase_s3
      - CATALOG_IMAGE_KEEP_DATABASE_COPY=true
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    entrypoint: [python, /prep/start_guard.py]
    command: [gunicorn, run:app, --bind, "0.0.0.0:5000", --workers, "2", --timeout, "60", --graceful-timeout, "30", --max-requests, "1000", --max-requests-jitter, "100", --error-logfile, "-"]
    volumes:
      - /opt/openclaw-pilot/secrets/backend-token:/run/secrets/openclaw-token:ro
      - /opt/openclaw-pilot/gateway-ca.crt:/run/openclaw/gateway-ca.crt:ro
    configs:
      - source: start_guard
        target: /prep/start_guard.py
      - source: station_heartbeat_v1
        target: /app/contracts/station-heartbeat-v1/contract.schema.json
      - source: station_production_progress_v1
        target: /app/contracts/station-production-progress-v1/contract.schema.json
      - source: station_legacy_history_v1
        target: /app/contracts/station-legacy-history-v1/contract.schema.json
      - source: station_monitoring_sync_v1
        target: /app/contracts/station-monitoring-sync-v1/contract.schema.json
    tmpfs:
      - /tmp:size=67108864,mode=1777
      - /app/logs:size=83886080,uid=10001,gid=10001,mode=0700
      - /app/instance:size=16777216,uid=10001,gid=10001,mode=0700
    networks: [database, egress, proxy, openclaw_private]
    labels:
      enva.scm.config-revision: "kg-cutoff-iso-v1"
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.scm-pilot-api-http.rule: Host(`api-scm.envaperu.pe`)
      traefik.http.routers.scm-pilot-api-http.entrypoints: web
      traefik.http.routers.scm-pilot-api-http.middlewares: scm-pilot-api-https
      traefik.http.routers.scm-pilot-api-http.service: scm-pilot-api
      traefik.http.middlewares.scm-pilot-api-https.redirectscheme.scheme: https
      traefik.http.middlewares.scm-pilot-api-https.redirectscheme.permanent: "true"
      traefik.http.routers.scm-pilot-api.rule: Host(`api-scm.envaperu.pe`)
      traefik.http.routers.scm-pilot-api.entrypoints: websecure
      traefik.http.routers.scm-pilot-api.tls: "true"
      traefik.http.routers.scm-pilot-api.tls.certresolver: letsencrypt
      traefik.http.routers.scm-pilot-api.service: scm-pilot-api
      traefik.http.services.scm-pilot-api.loadbalancer.server.port: "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  db:
    image: postgres:17-bookworm@sha256:91eb910c44c7ed13f7f1a4ccadaa9ca72ef14cddc04cacb6e070e48eb44731a3
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    shm_size: 256m
    pids_limit: 128
    environment:
      POSTGRES_DB: scm_pilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [pg_bootstrap_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    command: [postgres, -c, shared_buffers=256MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, max_connections=50, -c, max_wal_size=1GB, -c, log_statement=none]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d scm_pilot"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  openclaw_private:
    external: true
    name: openclaw_scm_private
  database:
    internal: true
  egress: {}
  proxy:
    external: true
    name: dokploy-network
volumes:
  pgdata: {}
configs:
  start_guard:
    file: ./start_guard.py
  station_heartbeat_v1:
    file: ../../contracts/station-heartbeat-v1/contract.schema.json
  station_production_progress_v1:
    file: ../../contracts/station-production-progress-v1/contract.schema.json
  station_legacy_history_v1:
    file: ../../contracts/station-legacy-history-v1/contract.schema.json
  station_monitoring_sync_v1:
    file: ../../contracts/station-monitoring-sync-v1/contract.schema.json

secrets:
  pg_bootstrap_password:
    file: ${SCM_PG_PASSWORD_FILE:?Administrator must approve and supply bootstrap password file}
