# RELEASE SOURCE: 167154600b58f62e536fc1cf7b0764713ab0860d
# PREPARATION ONLY: requires approved administrator handoff before any start.
# Project name is controlled by Dokploy: envaperuscmpilot-scmpilot-cnxr9n
services:
  api:
    image: ghcr.io/estebansulcainfante/envaperu-scm-api@sha256:b5fdcba32bf9ccead3e7234adbdf4ac15f0ce0e33b9246aa2fda8532bdf65164
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 128
    env_file:
      - ${SCM_API_ENV_FILE:?Administrator must securely supply API environment file}
    environment:
      SCM_AUTH_MODE: supabase
      CATALOG_IMAGE_STORAGE: supabase_s3
      CATALOG_IMAGE_KEEP_DATABASE_COPY: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    entrypoint: [python, /prep/start_guard.py]
    command: [gunicorn, run:app, --bind, "0.0.0.0:5000", --workers, "2", --timeout, "60", --graceful-timeout, "30", --max-requests, "1000", --max-requests-jitter, "100", --error-logfile, "-"]
    configs:
      - source: start_guard
        target: /prep/start_guard.py
    tmpfs:
      - /tmp:size=67108864,mode=1777
      - /app/logs:size=83886080,uid=10001,gid=10001,mode=0700
      - /app/instance:size=16777216,uid=10001,gid=10001,mode=0700
    networks: [database, egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  db:
    image: postgres:17-bookworm@sha256:91eb910c44c7ed13f7f1a4ccadaa9ca72ef14cddc04cacb6e070e48eb44731a3
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1536m
    mem_reservation: 512m
    shm_size: 256m
    pids_limit: 128
    environment:
      POSTGRES_DB: scm_pilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [pg_bootstrap_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [database]
    command: [postgres, -c, shared_buffers=256MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, max_connections=50, -c, max_wal_size=1GB, -c, log_statement=none]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d scm_pilot"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  database:
    internal: true
  egress: {}
volumes:
  pgdata: {}
configs:
  start_guard:
    file: ./start_guard.py

secrets:
  pg_bootstrap_password:
    file: ${SCM_PG_PASSWORD_FILE:?Administrator must approve and supply bootstrap password file}
