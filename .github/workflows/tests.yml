name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      # Canonical contracts match the already-deployed backend contract.
      # Keep the workspace authority and station consumer reproducible.
      # Repositories are public; the default read-only token is sufficient.
      - name: Check out canonical contracts
        uses: actions/checkout@v7
        with:
          repository: estebanSulcaInfante/envaperu-workspace
          ref: 16e97cd4a8d61638a386fbf07605a621d8c4b88d
          sparse-checkout: contracts
          persist-credentials: false
      - name: Check out backend under test
        uses: actions/checkout@v7
        with:
          path: backend
          persist-credentials: false
      - name: Check out pinned station contract consumer
        uses: actions/checkout@v7
        with:
          repository: estebanSulcaInfante/envaperu-workflow-scale-module-desktop
          ref: 5794afae3ff70b4dfece2a40ca7e199c6b794a69
          path: modulo-pesaje
          sparse-checkout: backend/contracts
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run fast suite
        run: python -m pytest

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://envaperu_test:envaperu_test@localhost:5432/envaperu_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: envaperu_test
          POSTGRES_USER: envaperu_test
          POSTGRES_PASSWORD: envaperu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envaperu_test -d envaperu_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      # Canonical contracts match the already-deployed backend contract.
      # Keep the workspace authority and station consumer reproducible.
      # Repositories are public; the default read-only token is sufficient.
      - name: Check out canonical contracts
        uses: actions/checkout@v7
        with:
          repository: estebanSulcaInfante/envaperu-workspace
          ref: 16e97cd4a8d61638a386fbf07605a621d8c4b88d
          sparse-checkout: contracts
          persist-credentials: false
      - name: Check out backend under test
        uses: actions/checkout@v7
        with:
          path: backend
          persist-credentials: false
      - name: Check out pinned station contract consumer
        uses: actions/checkout@v7
        with:
          repository: estebanSulcaInfante/envaperu-workflow-scale-module-desktop
          ref: 5794afae3ff70b4dfece2a40ca7e199c6b794a69
          path: modulo-pesaje
          sparse-checkout: backend/contracts
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL smoke test
        run: python -m pytest -m postgres
