name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run fast suite
        run: python -m pytest

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://envaperu_test:envaperu_test@localhost:5432/envaperu_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: envaperu_test
          POSTGRES_USER: envaperu_test
          POSTGRES_PASSWORD: envaperu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envaperu_test -d envaperu_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL smoke test
        run: python -m pytest -m postgres
